<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Qureo Solver — مشروع بوت تليجرام لمنصة كيريو.">
    <title>Qureo Solver | كيريو</title>
    <style>
      :root { color-scheme: light; background: #f3f0e7; color: #203b32; font-family: Tahoma, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: clamp(24px, 7vw, 96px); display: grid; align-content: center; }
      main { width: 100%; max-width: 850px; margin-inline: auto; border-block-start: 5px solid #426c53; padding-block: 32px; }
      .label { font-family: Georgia, serif; letter-spacing: .12em; font-size: 14px; }
      h1 { font-size: clamp(40px, 8vw, 76px); line-height: 1.4; margin: 32px 0 20px; }
      p { max-width: 620px; font-size: 18px; line-height: 1.9; }
      .note { color: #536058; border-block-start: 1px solid #bec6b8; padding-block-start: 24px; margin-block-start: 40px; font-size: 15px; }
      a { display: inline-block; color: #fffdf6; background: #294e3e; padding: 14px 24px; text-decoration: none; margin-block-start: 16px; }
      a:hover { background: #3d6652; }
      a:focus-visible { outline: 3px solid #986725; outline-offset: 5px; }
    </style>
  </head>
  <body>
    <main>
      <div class="label" lang="en" dir="ltr">QUREO SOLVER</div>
      <h1>كيريو، خطوة بخطوة.</h1>
      <p>مشروع بوت تليجرام للعمل مع منصة كيريو، مع أدوات للبرمجة بلغة بايثون وجافاسكريبت.</p>
      <a href="https://github.com/NOI47/qureo-solver">استعرض المشروع ودليل التشغيل</a>
      <p class="note">هذه صفحة تعريفية بالمشروع. يعمل بوت تليجرام والمتصفح على خادم منفصل، وتجد تفاصيل الإعداد والتشغيل في دليل المشروع.</p>
    </main>
  </body>
</html>
